apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    # No Loki in this local stack - logs are read straight from
    # `docker compose logs`, filtered by the trace_id
    # config/logging_config.py already injects into every JSON line (see
    # add_trace_context) - grep for it there instead of a log datasource.
    jsonData:
      tracesToMetrics:
        datasourceUid: prometheus
