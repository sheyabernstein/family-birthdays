{% extends "base.html" %}
{% block title %}Cancel broadcast - {{ block.super }}{% endblock %}
{% block content %}
    <div class="page-header">
        <h1>Cancel this broadcast?</h1>
    </div>
    <div class="card">
        <p>{{ object.text|safe }}</p>
        <p class="muted">Scheduled for {{ object.send_at|date:"l, F j, Y, g:i A" }}. This can't be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit"
                    class="btn"
                    style="background: var(--wine);
                           border-color: var(--wine)"
                    title="Cancel this broadcast before it sends">Cancel broadcast</button>
            <a class="btn btn-outline"
               href="{% url 'notifications:broadcast_list' %}">Back</a>
        </form>
    </div>
{% endblock %}
