{% load notifications_extras %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light dark">
        <meta name="supported-color-schemes" content="light dark">
        <title>{% block title %}Family Tree{% endblock %}</title>
        <style>
            body, table, td { margin: 0; padding: 0; }
            body { background: #eeebe1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
            .paper { background: #f6f4ec; }
            .ink { color: #221f1a; }
            .muted { color: #5b5748; }
            .footer { color: #5b5748; }
            a { color: #7a2e3a; }
            /* A call-to-action button (see accounts/templates/accounts/email/
               sign_in.html) - background lives on the .btn-email-bg <td>,
               not the <a> itself, since Outlook desktop's Word rendering
               engine can ignore a background set directly on a link. Both
               need to invert together in dark mode, or the button vanishes
               against a card background that's just flipped to match it. */
            .btn-email-bg { background: #221f1a; }
            .btn-email-text { color: #eeebe1; }

            /* Dark mode: only background/text/link colors change - see
               AGENTS.md's "don't tie ourselves in knots" note. Apple
               Mail/iOS Mail honor this; Gmail's support is partial and
               Outlook desktop ignores it outright - those just keep
               showing the light version, which is an acceptable, known
               trade-off, not a bug to chase further. */
            @media (prefers-color-scheme: dark) {
                body { background: #171613 !important; }
                /* The outer, full-bleed <table> below carries its own
                   inline background (some clients don't reliably render
                   a plain <body> background) - without this class hook,
                   that inline light background sat on top of <body>'s
                   own dark override and the whole page outside the card
                   stayed visibly light in dark mode regardless of what
                   <body> itself was set to. */
                .page-bg { background: #171613 !important; }
                .paper { background: #221f1a !important; }
                .ink { color: #eeebe1 !important; }
                .muted { color: #b9b3a0 !important; }
                .footer { color: #8a8470 !important; }
                a { color: #d98a9a !important; }
                .btn-email-bg { background: #eeebe1 !important; }
                .btn-email-text { color: #221f1a !important; }
            }
        </style>
    </head>
    <body>
        <table role="presentation"
               width="100%"
               cellpadding="0"
               cellspacing="0"
               class="page-bg"
               style="background:#eeebe1">
            <tr>
                <td align="center" style="padding: 24px 16px;">
                    <table role="presentation"
                           width="100%"
                           cellpadding="0"
                           cellspacing="0"
                           style="max-width: 480px">
                        <tr>
                            <td class="paper ink"
                                style="background:#f6f4ec;
                                       border-radius: 8px;
                                       padding: 32px 28px">
                                <table role="presentation" cellpadding="0" cellspacing="0">
                                    <tr>
                                        <td style="padding-right: 14px; vertical-align: middle;">
                                            <img src="{% block icon %}{% event_icon_url 'notifications/img/event-icons/default.png' %}{% endblock %}"
                                                 alt="{% block icon_alt %}{% endblock %}"
                                                 width="40"
                                                 height="40"
                                                 style="display:block;
                                                        border-radius: 50%">
                                        </td>
                                        <td style="vertical-align: middle;">
                                            <span class="ink"
                                                  style="font-size: 20px;
                                                         font-weight: 600">{{ family_name|default:"Family Tree" }}</span>
                                        </td>
                                    </tr>
                                </table>
                                <div class="ink"
                                     style="font-size: 16px;
                                            line-height: 1.6;
                                            margin-top: 24px">
                                    {% block body %}{% endblock %}
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="footer"
                                style="padding: 16px 8px;
                                       font-size: 12px;
                                       text-align: center">
                                {% block footer %}
                                    Sent by {{ family_name|default:"Family Tree" }}. <a href="{% absolute_page_url 'notifications:subscriptions' %}">Manage notification settings</a>.
                                {% endblock %}
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
