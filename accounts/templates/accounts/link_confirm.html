{% extends "base.html" %}
{% block title %}Sign in - {{ block.super }}{% endblock %}
{% block main_class %}auth-main{% endblock %}
{% block content %}
    <div class="auth-shell">
        <div class="auth-card">
            <h1>Sign in</h1>
            <p class="muted">Tap below to finish signing in.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn">Sign in</button>
            </form>
        </div>
    </div>
{% endblock %}
