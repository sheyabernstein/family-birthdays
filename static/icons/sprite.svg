<!--
  A hand-vendored subset of Lucide (lucide.dev, ISC-licensed, feather-icons'
  maintained successor) - individual icon source, not the lucide npm
  package's own createIcons() JS runtime. That runtime inflates
  <i data-lucide="..."> placeholders into <svg> after the fact, which would
  silently no-op on markup injected outside its own re-scan (an ajax-loaded
  fragment - see notifications/occurrence_preview.html - or family_tree.html's
  own client-rendered chart cards). Referencing a <symbol> here via
  <use href="...sprite.svg#icon-name"> needs no such pass: it's real, already-
  formed markup the moment it's in the DOM, from a full page load or a swap
  alike. Lives under the top-level static/ dir, not an app's own - like
  css/app.css, every icon here is genuinely global, not scoped to whichever
  app's template first needed it. Add new icons by copying another one's
  viewBox/stroke attributes - see family.templatetags.family_extras.icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none">
  <symbol id="icon-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <path d="M12 16v-4"/>
    <path d="M12 8h.01"/>
  </symbol>
  <symbol id="icon-triangle-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
    <path d="M12 9v4"/>
    <path d="M12 17h.01"/>
  </symbol>
  <symbol id="icon-arrow-up-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 7h10v10"/>
    <path d="M7 17 17 7"/>
  </symbol>
  <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
    <circle cx="12" cy="12" r="3"/>
  </symbol>
  <symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m6 9 6 6 6-6"/>
  </symbol>
</svg>
